# CircleCI configuration (optional — not required for CI)
version: 2.1

# Define the execution environment with parameterized Ruby version
executors:
  rails-env:
    parameters:
      ruby-version:
        type: string
    docker:
      - image: cimg/ruby:<< parameters.ruby-version >>
        environment:
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      - image: cimg/postgres:17.10
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails_8_api_authentication_test

jobs:
  build_and_test:
    parameters:
      ruby-version:
        type: string
    executor:
      name: rails-env
      ruby-version: << parameters.ruby-version >>
    steps:
      # 1. Check out the source code
      - checkout

      # 2. Install required system dependencies (libvips for Active Storage, libpq for PostgreSQL)
      - run:
          name: "Install system dependencies"
          command: |
            sudo apt-get update
            sudo apt-get install -y libvips libpq-dev postgresql-client

      # 3. Wait for the PostgreSQL service container to accept connections
      - run:
          name: "Wait for PostgreSQL"
          command: |
            for i in $(seq 1 30); do
              if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null; then
                echo "PostgreSQL is ready"
                exit 0
              fi
              sleep 2
            done
            echo "PostgreSQL did not become ready in time" >&2
            exit 1

      # 4. Restore cached gems to speed up the build process
      - restore_cache:
          keys:
            - v1-gem-cache-<< parameters.ruby-version >>-{{ checksum "Gemfile" }}
            - v1-gem-cache-<< parameters.ruby-version >>-

      # 5. Install Ruby gems
      - run:
          name: "Install Ruby dependencies"
          command: |
            gem install bundler
            bundle config set --local path 'vendor/bundle'
            bundle install

      # 6. Save gems to cache for future builds
      - save_cache:
          paths:
            - ./vendor/bundle
          key: v1-gem-cache-<< parameters.ruby-version >>-{{ checksum "Gemfile" }}

      # 7. Set up the PostgreSQL test database
      - run:
          name: "Database setup"
          environment:
            POSTGRES_HOST: 127.0.0.1
            POSTGRES_PORT: 5432
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_TEST_DB: rails_8_api_authentication_test
            POSTGRES_STATEMENT_TIMEOUT: 5000ms
          command: bin/rails db:prepare

      # 8. Scan for common Rails security vulnerabilities
      - run:
          name: "Scan for common Rails security vulnerabilities"
          command: bin/brakeman --no-pager

      # 9. Lint code for consistent style
      - run:
          name: "Lint code for consistent style"
          command: bin/rubocop

      # 10. Run the test suite with coverage enabled
      - run:
          name: "Run tests with coverage"
          environment:
            POSTGRES_HOST: 127.0.0.1
            POSTGRES_PORT: 5432
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_TEST_DB: rails_8_api_authentication_test
            POSTGRES_STATEMENT_TIMEOUT: 5000ms
          command: COVERAGE=1 bundle exec rails test

      # 11. Store the generated SimpleCov coverage report as an artifact
      - store_artifacts:
          path: public/coverage
          destination: coverage-report-ruby-<< parameters.ruby-version >>

  # Boots Rails with JWT_AUTH_HEADER=X-Authorization (Beam.cloud workaround)
  # and runs the full suite in a separate process. Initializers are evaluated
  # once per process, so this is an independent job rather than a runtime toggle.
  test_custom_header:
    executor:
      name: rails-env
      ruby-version: "3.3"
    environment:
      JWT_AUTH_HEADER: X-Authorization
    steps:
      - checkout
      - run:
          name: "Install system dependencies"
          command: |
            sudo apt-get update
            sudo apt-get install -y libvips libpq-dev postgresql-client
      - run:
          name: "Wait for PostgreSQL"
          command: |
            for i in $(seq 1 30); do
              if pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null; then
                echo "PostgreSQL is ready"
                exit 0
              fi
              sleep 2
            done
            echo "PostgreSQL did not become ready in time" >&2
            exit 1
      - restore_cache:
          keys:
            - v1-gem-cache-3.3-{{ checksum "Gemfile" }}
            - v1-gem-cache-3.3-
      - run:
          name: "Install Ruby dependencies"
          command: |
            gem install bundler
            bundle config set --local path 'vendor/bundle'
            bundle install
      - save_cache:
          paths:
            - ./vendor/bundle
          key: v1-gem-cache-3.3-{{ checksum "Gemfile" }}
      - run:
          name: "Database setup"
          environment:
            POSTGRES_HOST: 127.0.0.1
            POSTGRES_PORT: 5432
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_TEST_DB: rails_8_api_authentication_test
            POSTGRES_STATEMENT_TIMEOUT: 5000ms
          command: bin/rails db:prepare
      - run:
          name: "Run tests with custom JWT header"
          environment:
            POSTGRES_HOST: 127.0.0.1
            POSTGRES_PORT: 5432
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_TEST_DB: rails_8_api_authentication_test
            POSTGRES_STATEMENT_TIMEOUT: 5000ms
          command: bundle exec rails test

# Define the workflow to orchestrate job execution
workflows:
  version: 2
  test_app_workflow:
    jobs:
      - build_and_test:
          matrix:
            parameters:
              ruby-version: ["3.2", "3.3", "4.0"]
      - test_custom_header
